# SchoolMate — base compose: postgres + backend + frontend (Phase 8).
services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      # Server-side (route handlers / proxy) reach the backend over the compose
      # network. The browser still talks to the frontend at localhost:3000.
      API_INTERNAL_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  pgdata:

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: socialhub
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: socialhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socialhub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The Postgres service is reachable on localhost from the runner.
      DATABASE_URL: postgresql+asyncpg://socialhub:devpassword@localhost:5432/socialhub
      JWT_SECRET_KEY: ci-secret
      JWT_REFRESH_SECRET_KEY: ci-secret-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # host is 3.14, but the app targets 3.12 (asyncpg)
      - name: Install backend (with dev extras)
        working-directory: backend
        run: pip install ".[dev]"
      - name: Ruff
        working-directory: backend
        # Informational: the baseline carries known B008/F821 noise (idiomatic
        # FastAPI Depends + SQLAlchemy forward refs), so this doesn't gate CI.
        continue-on-error: true
        run: ruff check app
      - name: Pytest
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend · lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Build & publish images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write # publish to GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Publish only on pushes to main; PRs still build the images to validate
      # the Dockerfiles, but don't push.
      - name: Resolve publish flag + lowercase namespace
        id: cfg
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ steps.cfg.outputs.push }}
          tags: |
            ghcr.io/${{ steps.cfg.outputs.owner }}/schoolmate-backend:${{ github.sha }}
            ghcr.io/${{ steps.cfg.outputs.owner }}/schoolmate-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ steps.cfg.outputs.push }}
          tags: |
            ghcr.io/${{ steps.cfg.outputs.owner }}/schoolmate-frontend:${{ github.sha }}
            ghcr.io/${{ steps.cfg.outputs.owner }}/schoolmate-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
